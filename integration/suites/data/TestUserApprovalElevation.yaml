name: TestUserApprovalElevation
metadata:
  subsystems:
    - authz
    - elevation
    - prompting
  tags:
    - user-approval
  runtimes:
    - go
  tier: focused
config_dir: test/userapproval
log_name: bottest.log
flow:
  - name: request-elevation
    send:
      user: alice
      channel: general
      text: ;go-sec-elevated
  - name: requester-chooses-approver
    receive:
      user: alice
      channel: general
      text_pattern: "Approval required for command gosec/secelevated\\. Select one approver: a\\) bob, b\\) carol"
  - name: select-carol
    send:
      user: alice
      channel: general
      text: b
  - name: requester-told-carol-will-be-asked
    receive:
      channel: general
      text_pattern: "Ok, hold on while I ask 'carol' for approval\\.\\.\\."
  - name: carol-approval-prompt
    receive:
      user: carol
      text_pattern: "alice is requesting approval to run command gosec/secelevated - approve\\? \\(y/n\\)"
  - name: carol-approves
    send:
      user: carol
      text: "yes"
  - name: approval-granted
    receive:
      channel: general
      text_pattern: "Approval granted by carol"
  - name: protected-command-runs
    receive:
      channel: general
      text_pattern: "SECURITY CHECK: secelevated"
  - name: request-denied-elevation
    send:
      user: alice
      channel: general
      text: ;go-sec-elevated
  - name: requester-chooses-denying-approver
    receive:
      user: alice
      channel: general
      text_pattern: "Approval required for command gosec/secelevated\\. Select one approver: a\\) bob, b\\) carol"
  - name: select-bob
    send:
      user: alice
      channel: general
      text: a
  - name: requester-told-bob-will-be-asked
    receive:
      channel: general
      text_pattern: "Ok, hold on while I ask 'bob' for approval\\.\\.\\."
  - name: bob-approval-prompt
    receive:
      user: bob
      text_pattern: "alice is requesting approval to run command gosec/secelevated - approve\\? \\(y/n\\)"
  - name: bob-denies
    send:
      user: bob
      text: "no"
  - name: approval-denied
    receive:
      channel: general
      text_pattern: "Approval denied by bob"
  - name: protected-command-blocked
    receive:
      channel: general
      text_pattern: "Sorry, this command requires elevation"
  - name: request-non-strict-self-approval
    send:
      user: alice
      channel: general
      text: ;go-sec-self-approval
  - name: self-approval-granted
    receive:
      channel: general
      text_pattern: "Approval granted by alice"
  - name: non-strict-protected-command-runs
    receive:
      channel: general
      text_pattern: "SECURITY CHECK: secelevated"
  - name: request-single-approver-elevation
    send:
      user: alice
      channel: general
      text: ;go-sec-single-approver
  - name: single-approver-selected-automatically
    receive:
      channel: general
      text_pattern: "Ok, hold on while I ask 'david' for approval\\.\\.\\."
  - name: david-approval-prompt
    receive:
      user: david
      text_pattern: "alice is requesting approval to run command gosecsingle/secelevated - approve\\? \\(y/n\\)"
  - name: david-approves
    send:
      user: david
      text: "yes"
  - name: single-approver-approval-granted
    receive:
      channel: general
      text_pattern: "Approval granted by david"
  - name: single-approver-protected-command-runs
    receive:
      channel: general
      text_pattern: "SECURITY CHECK: secelevated"
