name: TestHelp
metadata:
  subsystems:
    - help
    - routing
  tags:
    - catch-all
    - discovery
  runtimes:
    - go
  tier: smoke
config_dir: test/membrain
log_name: bottest.log
cases:
  - input:
      user: alice
      channel: deadzone
      text: ;help
    replies:
      - channel: deadzone
        text_pattern: '(?s:Quick help.*- /bender help <keyword> - get help for the provided <keyword>.*- /bender commands - browse commands available in this channel.*- /bender help-all - summarize all commands available in this channel, including global commands.*Plugin help: /bender help <plugin>.*Exact command help: /bender help <plugin>/<command>.*Browse this channel: /bender commands)'
        threaded: true
    events:
      - CommandTaskRan
      - GoPluginRan
  - input:
      user: alice
      channel: deadzone
      text: ;commands
    replies:
      - channel: deadzone
        text_pattern: '(?s:Commands available in this channel.*bashdemo/hear.*;hear.*builtin-admin/encryptsecret.*/bender encrypt-secret <secret>.*builtin-help/commands.*/bender commands.*browse commands available.*builtin-help/help.*/bender help <keyword>.*find help for commands.*For full command help, use /bender help <plugin>/<command>)'
        threaded: true
    events:
      - CommandTaskRan
      - GoPluginRan
  - input:
      user: alice
      channel: deadzone
      text: ;help-all
    replies:
      - channel: deadzone
        text_pattern: '(?s:Commands available in this channel \(including global\).*builtin-help/help.*help <keyword>.*find help for commands.*For full command help, use /bender help <plugin>/<command>)'
        threaded: true
    events:
      - CommandTaskRan
      - GoPluginRan
  - input:
      user: alice
      channel: deadzone
      text: ;help help
    replies:
      - channel: deadzone
        text_pattern: '(?s:Command matches for keyword: help.*help/help.*help with robot.*give general help on the help system.*builtin-help/help.*help <keyword>.*find help for commands.*For full command help, use /bender help <plugin>/<command>)'
        threaded: true
    events:
      - CommandTaskRan
      - GoPluginRan
  - input:
      user: alice
      channel: deadzone
      text: ;help knock
    replies:
      - channel: deadzone
        text_pattern: '(?s:Command help: knock/knock.*Summary: Starts an interactive knock-knock joke\..*Usage: tell me a knock-knock joke.*Examples:.*;tell me a knock-knock joke.*Availability:)'
        threaded: true
    events:
      - CommandTaskRan
      - GoPluginRan
  - input:
      user: alice
      channel: deadzone
      text: ;help knock/knock
    replies:
      - channel: deadzone
        text_pattern: '(?s:Command help: knock/knock.*Usage: tell me a knock-knock joke.*Availability:)'
        threaded: true
    events:
      - CommandTaskRan
      - GoPluginRan
  - input:
      user: alice
      channel: general
      text: ;tell me a jok
    replies:
      - channel: general
        text_pattern: '(?s:;tell me a jok looks close to knock/knock.*Try: ;tell me a knock-knock joke.*More help: /bender help knock/knock)'
        threaded: true
    events:
      - CatchAllsRan
      - CatchAllTaskRan
      - GoPluginRan
  - input:
      user: alice
      channel: deadzone
      text: ;knok
    replies:
      - channel: deadzone
        text_pattern: '(?s:I couldn''t match ;knok in channel #deadzone.*#general or #random.*/bender help knock/knock)'
        threaded: true
    events:
      - CatchAllsRan
      - CatchAllTaskRan
      - GoPluginRan
